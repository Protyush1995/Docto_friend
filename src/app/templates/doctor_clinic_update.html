<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Clinic</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --primary: #4d20cab8; --bg:#f6f8ff; --card-bg:#fff; --muted:#6b7280;
      --accent:#0b63ff; --border-radius:12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 400px at 10% 10%, rgba(0,64,255,0.06), transparent 10%),
                  linear-gradient(180deg,var(--bg),#fff 60%);
      color:#0b1226; padding:20px;
    }
    .container{ max-width:1000px; margin:0 auto; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{ width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#0066ff); display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,64,255,0.08);font-size:20px;}
    h1{ margin:0;font-size:18px;color:var(--primary) }
    .sub{ color:var(--muted); font-size:13px; margin-top:4px; }
    .navigation{ display:flex; align-items:center; gap:10px; }
    .card{ background:var(--card-bg); border-radius:var(--border-radius); padding:20px; box-shadow:0 2px 6px rgba(0,0,0,0.06); border:1px solid rgba(0,64,255,0.06); }
    form{ display:flex; flex-direction:column; gap:14px; }
    label{ font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600; display:block; }
    input, select, textarea{ padding:9px; border-radius:8px; border:1px solid rgba(5,11,30,0.12); font-size:14px; width:100%; }
    .row{ display:flex; gap:12px; }
    .row > div{ flex:1; }
    .btn{ padding:10px 14px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(180deg,var(--primary),#0033cc); color:#fff; font-weight:600; }
    .btn.ghost{ background:transparent; color:var(--primary); border:1px solid rgba(0,64,255,0.08); padding:8px 12px; }
    .muted{ color:var(--muted); font-size:13px; }
    .schedule-grid{ display:grid; grid-template-columns:120px repeat(7,1fr); gap:6px; background:#fff; padding:12px; border-radius:12px; margin-top:8px; align-items:center; }
    .day{ text-align:center; font-weight:600; color:var(--primary); font-size:13px; }
    .time-col{ font-weight:600; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px; }
    .slot{ display:flex; justify-content:center; align-items:center; }
    .slot input{ width:18px; height:18px; cursor:pointer; }
    table.schedule-table{ width:100%; border-collapse:collapse; margin-top:8px; }
    table.schedule-table th, table.schedule-table td{ padding:8px; border-bottom:1px solid rgba(0,0,0,0.06); text-align:left; }
    .actions{ display:flex; gap:8px; }
    .small-btn{ padding:6px 10px; border-radius:6px; border:none; cursor:pointer; background:var(--primary); color:#fff; font-size:13px; font-weight:600; }
    .small-btn.clear{ background:#d32f2f; }
    @media (max-width:720px){
      .row{ flex-direction:column; }
      .schedule-grid{ grid-template-columns: 1fr; grid-auto-rows:auto; }
      .schedule-grid .day{ text-align:left; padding-left:8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo"  aria-hidden="true"><img src="{{ url_for('static', filename='image/doctopal_logo_1.jpeg') }}" alt="Logo" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"></div>
        
        <div>
          <h1>Edit Clinic for <strong>Dr {{ doctor_data.firstname }} {{ doctor_data.lastname }} | {{clinic.clinicname}}</strong></h1>
          <div class="sub">Update clinic details and visit schedule</div>
        </div>
      </div>
      <div class="navigation">
        <a href="/doc_dashboard/{{user_id}}" class="btn ghost">Home</a>
      </div>
    </header>

    <section class="card">
      <form id="editClinicForm" method="POST" >
        <input type="hidden" name="clinic_id" id="clinic_id" value="{{ clinic.clinic_id }}">

        <div>
          <label>Clinic Name</label>
          <input type="text" id="clinicname" name="clinicname" required>
        </div>

        <div style="display:flex; gap:12px;">
          <div style="flex:1">
            <label>House No</label>
            <input type="text" id="house_no" name="house_no">
          </div>
          <div style="flex:1">
            <label>Street</label>
            <input type="text" id="street" name="street">
          </div>
        </div>

        <div style="display:flex; gap:12px;">
          <div style="flex:1"><label>Post Office</label><input type="text" id="post_office" name="post_office"></div>
          <div style="flex:1"><label>Police Station</label><input type="text" id="police_station" name="police_station"></div>
        </div>

        <div style="display:flex; gap:12px;">
          <div style="flex:1"><label>City</label><input type="text" id="city" name="city"></div>
          <div style="flex:1"><label>Pin Code</label><input type="text" id="pin_code" name="pin_code"></div>
        </div>

        <div style="display:flex; gap:12px;">
          <div style="flex:1"><label>State</label><input type="text" id="state" name="state"></div>
          <div style="flex:1"><label>Country</label><input type="text" id="country" name="country"></div>
        </div>

        <div style="display:flex; gap:12px;">
          <div style="flex:1"><label>Contact Number</label><input type="tel" id="primary_contact_number" name="primary_contact_number"></div>
          <div style="flex:1"><label>Alternative Contact</label><input type="tel" id="secondary_contact_number" name="secondary_contact_number"></div>
        </div>

        <div>
          <label>Email address</label>
          <input type="email" id="email" name="email">
        </div>

        <div>
          <label>Consultation Fees (₹)</label>
          <input type="number" id="doctor_consultation_fees" name="doctor_consultation_fees" min="0">
        </div>

        <!-- Schedule builder -->
        <h3 style="color:var(--primary); margin-top:8px;">Visit Schedule</h3>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <label for="sched_day">Day</label>
          <select id="sched_day"><option value="mon">Monday</option><option value="tue">Tuesday</option><option value="wed">Wednesday</option><option value="thu">Thursday</option><option value="fri">Friday</option><option value="sat">Saturday</option><option value="sun">Sunday</option></select>

          <label for="sched_start">Start</label>
          <select id="sched_start"></select>

          <label for="sched_end">End</label>
          <select id="sched_end"></select>

          <button type="button" id="sched_add" class="btn">Add</button>
          <button type="button" id="sched_clear" class="btn small-btn clear">Clear All</button>
        </div>

        <input type="hidden" id="schedule_json" name="schedule_json" value='{{ visit_schedule_serialized | tojson | safe }}'>

        <table class="schedule-table" id="schedule_table">
          <thead><tr><th>Day</th><th>Start</th><th>End</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>

        <div style="display:flex; gap:12px; margin-top:12px; justify-content:flex-end;">
          <button type="submit" class="btn">Save Clinic</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    // Coach: client-side logic to populate fields from server clinic object,
    // manage schedule rows, and serialize schedule_json before submit.

    (function(){
      // Helper: time options (every 15 minutes)
      function pad(n){return n.toString().padStart(2,'0')}
      const times = [];
      for(let h=8;h<20;h++){
        for(let m=0;m<60;m+=60){
          times.push(pad(h)+':'+pad(m));
        }
      }
      const startSel = document.getElementById('sched_start');
      const endSel = document.getElementById('sched_end');
      times.forEach(t=>{
        const o1 = document.createElement('option'); o1.value = t; o1.textContent = t; startSel.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = t; o2.textContent = t; endSel.appendChild(o2);
      });

      // Coach: helper to convert client payload -> DB structure
      function transformClientToDb(client) {
        const db = {};

        // direct mappings if present
        const direct = [
          "clinic_id","clinicname","email",
          "primary_contact_number","secondary_contact_number",
          "doctor_consultation_fees"
        ];
        for (const k of direct) {
          if (client[k] !== undefined) db[k] = client[k];
        }

        // address group
        const addrKeys = ["house_no","street","post_office","police_station","city","pin_code","state","country"];
        const address = {};
        let hasAddress = false;
        for (const k of addrKeys) {
          if (client[k] !== undefined) {
            address[k] = client[k];
            hasAddress = true;
          }
        }
        if (hasAddress) db.clinic_address = address;

        // schedule_json -> visit_schedule
        if (client.schedule_json !== undefined) {
          try {
            const arr = JSON.parse(client.schedule_json);
            const visit_schedule = {};
            for (const item of arr) {
              if (!item || !item.day || !item.start || !item.end) continue;
              const day = item.day.toLowerCase();
              const slot = `${item.start}-${item.end}`;
              if (!visit_schedule[day]) visit_schedule[day] = [];
              visit_schedule[day].push(slot);
            }
            db.visit_schedule = visit_schedule;
          } catch (e) {
            // invalid JSON: skip schedule
          }
        }

        return db;
      }


      // Map day short to label
      const dayMap = {mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday'};

      // Populate form fields from server-side clinic object (Jinja also sets input values above)
      const setIf = (id, val) => { const el = document.getElementById(id); if(el && (val !== undefined && val !== null)) el.value = val; }

      // Fields mapping — adjust keys to your backend model
      setIf('clinicname', '{{ clinic.clinicname | default("") }}');
      setIf('house_no',   '{{ clinic.clinic_address.house_no | default("") }}');
      setIf('street',    '{{ clinic.clinic_address.street | default("") }}');
      setIf('post_office','{{ clinic.clinic_address.post_office | default("") }}');
      setIf('police_station','{{ clinic.clinic_address.police_station | default("") }}');
      setIf('city',      '{{ clinic.clinic_address.city | default("") }}');
      setIf('pin_code',   '{{ clinic.clinic_address.pin_code | default("") }}');
      setIf('state',     '{{ clinic.clinic_address.state | default("") }}');
      setIf('country',   '{{ clinic.clinic_address.country | default("") }}');
      setIf('primary_contact_number','{{ clinic.primary_contact_number | default("") }}');
      setIf('secondary_contact_number','{{ clinic.secondary_contact_number | default("") }}');
      setIf('email','{{ clinic.email | default("") }}');
      setIf('doctor_consultation_fees','{{ clinic.doctor_consultation_fees | default("") }}');

      // Schedule UI management
      const tableBody = document.querySelector('#schedule_table tbody');
      // Read clinic JSON injected by Jinja (if present)
      // Single source: accept serialized array OR old object shape
      let schedule = [];
      try {
        const raw = JSON.parse(document.getElementById('schedule_json').value || '[]');
        console.log( raw )
        if (Array.isArray(raw)) {
          schedule = raw.slice();
        } else if (raw && typeof raw === 'object') {
          Object.keys(raw).forEach(day => {
            (raw[day] || []).forEach(range => {
              const [start, end] = range.split('-', 2);
              if (start && end) schedule.push({ day, start, end });
            });
          });
        }
        renderSchedule()
      } catch (e) {
        console.log("Error loading schedule sent from server side!!")
        console.log(e)
        schedule = [];
      }

      function renderSchedule() {
        tableBody.innerHTML = '';
        schedule.forEach((s, idx) => {
          const tr = document.createElement('tr');
          const dayTd = document.createElement('td'); dayTd.textContent = dayMap[s.day] || s.day;
          const startTd = document.createElement('td'); startTd.textContent = s.start;
          const endTd = document.createElement('td'); endTd.textContent = s.end;
          const actionTd = document.createElement('td');
          const del = document.createElement('button'); del.type='button'; del.textContent='Delete'; del.className='small-btn';
          del.addEventListener('click', ()=>{ schedule.splice(idx,1); renderSchedule(); });
          actionTd.appendChild(del);
          tr.appendChild(dayTd); tr.appendChild(startTd); tr.appendChild(endTd); tr.appendChild(actionTd);
          tableBody.appendChild(tr);
        });
        // sync hidden input
        document.getElementById('schedule_json').value = JSON.stringify(schedule);
      }

      document.getElementById('sched_add').addEventListener('click', ()=>{
      const day = document.getElementById('sched_day').value;
      const start = document.getElementById('sched_start').value;
      const end = document.getElementById('sched_end').value;
      if(!day || !start || !end){ return; }
      if(start >= end){ return; }

      // Remove any existing entries for the same day that overlap or are identical
      schedule = schedule.filter(s => {
        if (s.day !== day) return true; // keep other days
        // keep entry only if it does NOT overlap new interval
        return (end <= s.start) || (start >= s.end);
      });

      // Insert the new entry
      schedule.push({ day: day, start: start, end: end });

      // Optional: keep schedule sorted by day then start time
      const dayOrder = { mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6 };
      schedule.sort((a,b)=>{
        if(a.day !== b.day) return dayOrder[a.day] - dayOrder[b.day];
        return a.start.localeCompare(b.start);
      });

      renderSchedule();
    });


      document.getElementById('sched_clear').addEventListener('click', ()=>{
        if(!confirm('Clear all schedule entries?')) return;
        schedule = [];
        renderSchedule();
      });

      const form = document.getElementById('editClinicForm');
      if (!form) throw new Error('editClinicForm not found');

      form.addEventListener('submit', async(ev)=>{
        ev.preventDefault(); // STOP actual network request
        // Sync schedule hidden input
        const scheduleInput = document.getElementById('schedule_json');
        try { if (scheduleInput) scheduleInput.value = JSON.stringify(JSON.parse(scheduleInput.value||'[]')); } catch(e){console.log(e)}

        // Build plain object from form
        const obj = {};
        new FormData(form).forEach((v,k) => {
          // coerce clinicFees to number if needed
          obj[k] = obj[k] ? (Array.isArray(obj[k]) ? [...obj[k], v] : [obj[k], v]) : v;
        });
        // convert single-element arrays back to value
        Object.keys(obj).forEach(k => { if(Array.isArray(obj[k]) && obj[k].length===1) obj[k]=obj[k][0]; });
        
        //constructing url and data to feed
        const url = `/doc_clinic_update/{{ user_id }}/{{ clinic.clinic_id }}`
        data_to_JSON_db = transformClientToDb(obj)

        try {
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data_to_JSON_db),
            credentials: 'same-origin' // include cookies if needed (CSRF session)
          });

          if (!resp.ok) {
            const text = await resp.text().catch(()=>null);
            console.error('Server error', resp, text);
            alert('Save failed: ' + resp + ' ' + text);
            return;
          }

          // Success: handle redirect or JSON response
          const contentType = resp.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const data = await resp.json();
            console.log('Server JSON:', data);
            // if server returns HTML redirect page, you can navigate
            window.location.href = '/doc_dashboard/{{user_id}}'
          } else {
            const text = await resp.text();
            console.log('Server response:', text);
            // if server returns HTML redirect page, you can navigate
            window.location.href = '/doc_dashboard/{{user_id}}' 
          }
          alert('Clinic saved successfully.');
        } catch (err) {
          console.error('Fetch error', err);
          alert('Network error while saving clinic.');
        }
      });
    
    
    })();
  </script>
</body>
</html>
